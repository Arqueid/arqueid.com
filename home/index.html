<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://arqueid.com.br/favicon.png">
    <title>Arqueid</title>
    <meta name="description" content="Arqueid Design e criação de conteúdo web, imagem e documentação em video.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:url" content="https://arqueid.com.br/">
    
    <!-- Link para o arquivo CSS externo separado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: none;">

    <!-- 
      GUIA PARA O PROGRAMADOR:
      O menu superior, hambúrguer e barra lateral são injetados automaticamente 
      pelo script 'js/menu.js' logo abaixo.
    -->

    <main class="content-area">
        <div class="home-grid">
            <!-- Espaço reservado para o grande destaque preenchido via dados.js -->
            <div id="espaco-destaque"></div>
            
            <!-- Espaço reservado para os cards secundários -->
            <div id="espaco-secundarias" class="grade-secundaria"></div>
        </div>
    </main>

    <!-- Script de preenchimento dinâmico dos itens da Home -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof bancoDeDados !== 'undefined' && bancoDeDados.length > 0) {
                
                // Preenche o Destaque Principal (Índice 0)
                const destaque = bancoDeDados[0];
                const divDestaque = document.getElementById('espaco-destaque');

                divDestaque.innerHTML = `
                    <div class="destaque-principal">
                        <a href="${destaque.link}" target="_blank">
                            <div class="destaque-img-wrapper">
                                <img src="${destaque.imagem}" class="destaque-img" alt="${destaque.titulo}">
                            </div>
                            <span class="destaque-categoria">${destaque.categoria}</span>
                            <h2 class="destaque-titulo">${destaque.titulo}</h2>
                            <p class="destaque-resumo">${destaque.resumo}</p>
                        </a>
                    </div>
                `;

                // Preenche as Grades Secundárias (Índices 1, 2 e 3)
                const secundarias = bancoDeDados.slice(1, 4); 
                const divSecundarias = document.getElementById('espaco-secundarias');
                
                let htmlSecundario = '';
                secundarias.forEach(item => {
                    htmlSecundario += `
                        <div class="card-secundario">
                            <a href="${item.link}" target="_blank">
                                <img src="${item.imagem}" class="card-img" alt="${item.titulo}">
                                <span style="font-size: 10px; color:#b71c1c; font-weight:bold">${item.categoria}</span>
                                <h3>${item.titulo}</h3>
                                <p>${item.resumo.substring(0, 80)}...</p>
                            </a>
                        </div>
                    `;
                });

                divSecundarias.innerHTML = htmlSecundario;
            }
        });
    </script>

    <!-- Banco de dados de conteúdo -->
    <script src="https://arqueid.com.br/dados.js"></script>

    <!-- Script externo do menu reutilizável -->
    <script src="js/menu.js"></script>

    <!-- Script de segurança (Bloqueia o acesso caso o usuário não esteja logado) -->
    <script type="module" src="seguranca.js"></script>

</body>
</html>
