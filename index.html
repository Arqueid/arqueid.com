<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Arqueid - Login</title>
    <meta name="description" content="Arqueid Design e criação de conteúdo web, imagem e documentação em video.">
    <meta name="robots" content="index, follow">
    <meta property="og:url" content="https://arqueid.com.br/">
    <!-- Importação do arquivo CSS externo localizado na pasta css/ -->
    <link rel="stylesheet" href="https://arqueid.com.br/css/style-loguin.css">
</head>
<body>

    <!-- 
      GUIA PARA O PROGRAMADOR - ESTRUTURA HTML:
      - #login-container: Caixa central do formulário de autenticação.
      - input#email: Campo de entrada para o e-mail cadastrado.
      - input#senha: Campo de entrada para a senha.
      - button#btn-entrar: Dispara a validação do Firebase.
      - p#mensagem: Exibe o status de sucesso ou erro do login.
    -->
    <div id="login-container">
        <h2>Bem-Vindo</h2>
        
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email">
        
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
        
        <button id="btn-entrar">Entrar</button>
        
        <p id="mensagem"></p>
    </div>

    <script type="module">
        // 1. IMPORTAÇÃO DOS MÓDULOS DO FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 2. CHAVES DE CONEXÃO E CONFIGURAÇÃO DO PROJETO
        const firebaseConfig = {
            apiKey: "AIzaSyAo6qUEbkjs9XHaOa32YttJISC1oIwoMCI",
            authDomain: "sistemaloginarqueidbr.firebaseapp.com",
            projectId: "sistemaloginarqueidbr",
            storageBucket: "sistemaloginarqueidbr.firebasestorage.app",
            messagingSenderId: "463919580730",
            appId: "1:463919580730:web:5dd95aaf3a8063c69cd703"
        };

        // 3. INICIALIZAÇÃO DA AUTENTICAÇÃO
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 4. MAPEAMENTO DOS ELEMENTOS DA TELA
        const campoEmail = document.getElementById('email');
        const campoSenha = document.getElementById('senha');
        const botaoEntrar = document.getElementById('btn-entrar');
        const textoMensagem = document.getElementById('mensagem');

        // 5. FUNÇÃO DE LOGIN VIA FIREBASE
        botaoEntrar.addEventListener('click', () => {
            const email = campoEmail.value.trim();
            const senha = campoSenha.value;

            // Validação simples para evitar requisições vazias
            if (!email || !senha) {
                textoMensagem.style.color = "#f44336";
                textoMensagem.innerText = "Preencha todos os campos.";
                return;
            }

            signInWithEmailAndPassword(auth, email, senha)
            .then((resultado) => {
                textoMensagem.style.color = "#4caf50"; 
                textoMensagem.innerText = "Login aprovado. Acessando o sistema...";
                window.location.href = 'https://arqueid.com.br/home'; 
            })
            .catch((erro) => {
                textoMensagem.style.color = "#f44336"; 
                textoMensagem.innerText = "Acesso negado. Verifique os dados digitados.";
            });
        });
    </script>
</body>
</html>
