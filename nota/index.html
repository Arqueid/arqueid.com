<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://arqueid.com.br/favicon.png">
    <title>Arqueid/Nota</title>
    <meta name="description" content="Arqueid Design e criação de conteúdo web, imagem e documentação em video.">
     <meta name="robots" content="noindex, nofollow">
    <meta property="og:url" content="https://arqueid.com.br/">
    <style>
        /* 
         * GUIA PARA O PROGRAMADOR: ESTILOS (CSS)
         * Aqui você controla o layout principal e o painel de ferramentas.
         * Para adicionar um novo estilo visual ou nova classe para um novo componente, insira o CSS aqui.
         */
        
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #222;
        }

        /* Painel lateral esquerdo com os botões e cores */
        #painel-ferramentas {
            width: 250px;
            background-color: #111;
            color: #fff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        #painel-ferramentas h2 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            text-align: center;
        }

        #painel-ferramentas button, #painel-ferramentas label.btn-upload {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: 0.2s;
        }

        #painel-ferramentas button:hover, #painel-ferramentas label.btn-upload:hover {
            background-color: #45a049;
        }

        .seletor-cor {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Botão específico de gerar página */
        #btn-gerar {
            background-color: #008CBA !important;
            margin-top: 20px;
            font-weight: bold;
        }

        #btn-gerar:hover {
            background-color: #007B9E !important;
        }

        /* Área da direita (Tela de edição da página em si) */
        #area-edicao {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            /* Fundo escuro e letras brancas conforme exigido */
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container padrão para qualquer elemento inserido (título, texto, imagem) */
        .bloco-conteudo {
            position: relative;
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid transparent;
        }

        /* Hover para mostrar ao usuário que o elemento pode ser editado */
        .bloco-conteudo:hover {
            border: 1px dashed #666;
        }

        /* Botão vermelho de excluir elemento (só aparece no hover) */
        .btn-excluir {
            position: absolute;
            top: -15px;
            right: -15px;
            background-color: #ff4c4c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: none;
            font-weight: bold;
        }

        .bloco-conteudo:hover .btn-excluir {
            display: block;
        }

        /* Estética do conteúdo base */
        h1[contenteditable], p[contenteditable] { 
            outline: none; /* Remove a borda azul feia do navegador ao digitar */
        }
        p[contenteditable] { 
            line-height: 1.6; 
        }
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>

    <!-- Menu de Controles -->
    <div id="painel-ferramentas">
        <h2>Construtor</h2>
        
        <div class="seletor-cor">
            <label>Fundo:</label>
            <input type="color" id="cor-fundo" value="#1a1a1a" onchange="atualizarCorFundo()">
        </div>
        <div class="seletor-cor">
            <label>Texto:</label>
            <input type="color" id="cor-texto" value="#ffffff" onchange="atualizarCorTexto()">
        </div>

        <button onclick="adicionarTitulo()">+ Adicionar Título</button>
        <button onclick="adicionarParagrafo()">+ Adicionar Parágrafo</button>
        
        <!-- Upload de arquivo local oculto, acionado pela label visual -->
        <label for="input-imagem" class="btn-upload">+ Adicionar Imagem</label>
        <input type="file" id="input-imagem" accept="image/*" style="display: none;" onchange="adicionarImagem(event)">

        <button id="btn-gerar" onclick="gerarPaginaFinal()">Gerar Página</button>
    </div>

    <!-- Tela do site construído (já inicia com Título, Parágrafo e Imagem modelo) -->
    <div id="area-edicao">
        <div class="bloco-conteudo">
            <button class="btn-excluir" onclick="removerBloco(this)">X</button>
            <h1 contenteditable="true">Título Centralizado</h1>
        </div>
        
        <div class="bloco-conteudo">
            <button class="btn-excluir" onclick="removerBloco(this)">X</button>
            <p contenteditable="true">Clique aqui e digite seu texto. Este é um parágrafo de exemplo abaixo do título.</p>
        </div>

        <div class="bloco-conteudo">
            <button class="btn-excluir" onclick="removerBloco(this)">X</button>
            <img src="https://via.placeholder.com/800x450/444/fff?text=Sua+Imagem+Aqui" alt="Imagem Modelo">
        </div>
    </div>

    <script>
        /*
         * GUIA PARA O PROGRAMADOR: JAVASCRIPT
         * 
         * 1. COMO ADICIONAR UM NOVO COMPONENTE (Ex: Subtítulo, Link):
         * - Copie a função adicionarTitulo().
         * - Mude o nome para adicionarSubtitulo().
         * - Altere a tag HTML dentro da crase (`<h2 contenteditable="true">...</h2>`).
         * - Vá no painel-ferramentas do HTML acima e crie um novo botão `<button onclick="adicionarSubtitulo()">+ Subtítulo</button>`.
         * 
         * 2. COMO REMOVER UM COMPONENTE:
         * - Exclua o botão `<button onclick="...">` do painel-ferramentas no HTML.
         * - Exclua a função correspondente aqui no JavaScript.
         */

        const areaEdicao = document.getElementById('area-edicao');

        // FUNÇÃO BASE: Envolve o HTML injetado com a div de controle e botão excluir, e joga na tela
        function injetarBloco(htmlInterno) {
            const divContainer = document.createElement('div');
            divContainer.className = 'bloco-conteudo';
            
            const btnExcluir = `<button class="btn-excluir" onclick="removerBloco(this)">X</button>`;
            divContainer.innerHTML = btnExcluir + htmlInterno;
            
            areaEdicao.appendChild(divContainer);
        }

        // Adiciona bloco H1
        function adicionarTitulo() {
            injetarBloco(`<h1 contenteditable="true">Novo Título</h1>`);
        }

        // Adiciona bloco P
        function adicionarParagrafo() {
            injetarBloco(`<p contenteditable="true">Novo parágrafo de texto editável.</p>`);
        }

        // Lê a imagem local do usuário, transforma em base64 e injeta no editor
        function adicionarImagem(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const leitorArquivo = new FileReader();
                leitorArquivo.onload = function(e) {
                    // e.target.result contém a imagem realocada para texto (Base64), não precisa de servidor
                    injetarBloco(`<img src="${e.target.result}" alt="Imagem do Usuário">`);
                }
                leitorArquivo.readAsDataURL(arquivo);
            }
            // Zera o input para possibilitar o envio do mesmo arquivo novamente se o usuário apagou
            event.target.value = '';
        }

        // Exclui o bloco onde o botão "X" foi clicado
        function removerBloco(elementoBotao) {
            // Sobe um nível para a div pai (.bloco-conteudo) e remove a div inteira
            elementoBotao.parentNode.remove();
        }

        // Aplica a cor de fundo definida no input type color
        function atualizarCorFundo() {
            areaEdicao.style.backgroundColor = document.getElementById('cor-fundo').value;
        }

        // Aplica a cor do texto definida no input type color
        function atualizarCorTexto() {
            areaEdicao.style.color = document.getElementById('cor-texto').value;
        }

        /*
         * GERAÇÃO DO HTML FINAL
         * - Clona o conteúdo da área de edição.
         * - Remove os botões de fechar (X) e os atributos editáveis.
         * - Cria o esqueleto HTML padrão e abre tudo em uma guia nova do navegador.
         */
        function gerarPaginaFinal() {
            // Cria cópia exata do momento atual da tela para não quebrar o layout da interface
            const telaClonada = areaEdicao.cloneNode(true);

            // Varre o clone e remove botões de excluir
            telaClonada.querySelectorAll('.btn-excluir').forEach(btn => btn.remove());

            // Varre o clone e remove capacidade de edição (contenteditable)
            telaClonada.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));

            // Coleta cores correntes
            const corFundoFixada = areaEdicao.style.backgroundColor || '#1a1a1a';
            const corTextoFixada = areaEdicao.style.color || '#ffffff';

            // String do documento HTML definitivo para a nova guia
            const codigoHTMLNovo = `
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Nova Página</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: ${corFundoFixada};
            color: ${corTextoFixada};
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bloco-conteudo {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        h1, p { margin-top: 0; }
    </style>
</head>
<body>
    ${telaClonada.innerHTML}
</body>
</html>`;

            // Comando nativo do JS para abrir nova guia e escrever o código compilado
            const guiaJanela = window.open();
            guiaJanela.document.write(codigoHTMLNovo);
            guiaJanela.document.close();
        }
    </script>
</body>
</html>
